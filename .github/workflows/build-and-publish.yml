name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Beides steht im Fuß der Seite. Im Build-Kontext gibt es kein .git, also wird es hier
      # ausgerechnet und hereingereicht.
      - name: Collect build stamp
        id: stempel
        run: |
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "gebaut=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ steps.stempel.outputs.commit }}
            GEBAUT=${{ steps.stempel.outputs.gebaut }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        if: github.event_name == 'pull_request'
        run: |
          docker build -t alarmplaner:pr .
          docker run -d --name pruefung -p 8000:8000 alarmplaner:pr
          for versuch in $(seq 1 30); do
            sleep 1
            curl -fs http://127.0.0.1:8000/api/health && break
          done
          curl -fs http://127.0.0.1:8000/api/health
          sitzung=$(curl -fs -X POST http://127.0.0.1:8000/api/session | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          curl -fs -X PUT http://127.0.0.1:8000/api/session/arbeitsmappe \
            -H "X-Session-Id: $sitzung" -H 'Content-Type: application/json' \
            --data-binary @backend/src/render/sample/sample.json > /dev/null
          curl -fs -o zettel.pdf -X POST http://127.0.0.1:8000/api/render -H "X-Session-Id: $sitzung"
          head -c 4 zettel.pdf | grep -q '%PDF' && echo "PDF gerendert"
          docker rm -f pruefung
