name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # The render tests skip themselves when typst is missing, so it is installed here to make
      # sure they actually run. Keep the version in step with the Dockerfile.
      - name: Install typst
        env:
          TYPST_VERSION: v0.14.2
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          typst --version

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install pipenv
          pipenv sync --system

      - name: Run tests
        working-directory: backend/src
        run: python -m unittest discover -s services -t . -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `npm run build` type-checks with vue-tsc before it bundles, so this covers both.
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # The bearing and distance the sheet prints were recovered from two printed slips, not from
      # any specification, so those two values are the only thing the formula can be checked
      # against.
      - name: Check the Polar-Koordinaten
        run: node tools/polar_pruefen.mjs

      # Der Personenplan wird gerechnet und nirgends gepflegt, und die Prüfungen sind der Grund,
      # warum der Ablauf hier und nicht in einer Tabelle entsteht. Beides hängt an dieser einen
      # Rechnung.
      - name: Check den Ablaufplan
        run: node tools/ablauf_pruefen.mjs

      # Das Bewegungsbild, der Stand zu einem Zeitpunkt und die Umrechnung der amtlichen
      # Koordinaten in die der Karte — gegen Punkte, die der Berliner Dienst in beiden Systemen
      # ausgibt.
      - name: Check das Bewegungsbild
        run: node tools/bewegungen_pruefen.mjs

      # Browser and server each flatten the working set into paths, and they have to agree
      # exactly: a path only one side knows reads to the other as an entry that was never there.
      - name: Compare the flatteners
        run: |
          for mappe in backend/src/render/sample/sample.json tools/beispiel/ablauf.json; do
            python tools/pfade_vergleichen.py "$mappe" > server.txt
            node tools/pfade_vergleichen.mjs "$mappe" > browser.txt
            diff -u server.txt browser.txt
            echo "$mappe: $(wc -l < server.txt) Pfade, beide Seiten gleich"
          done

  zusammenarbeit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          pip install pipenv
          cd backend && pipenv sync --system && cd ..
          cd frontend && npm ci

      # Two clients on one workspace, driving the browser's real sync module outside a browser.
      # The merge is covered by unit tests; this covers the client half — the shadow copy and the
      # way an incoming change is folded into it, which is where the bugs were.
      - name: Two clients on one workspace
        run: node tools/sync_probe.mjs

      # Personenplan und Bewegungsbild entstehen zweimal: im Browser für die Ansicht, auf dem
      # Server für das PDF. Weichen sie ab, widerspricht der Ausdruck dem Bildschirm — und genau
      # das soll die Ableitung ja unmöglich machen.
      - name: Compare the derived plans
        run: |
          python tools/plan_vergleichen.py tools/beispiel/ablauf.json > server.txt
          node tools/plan_vergleichen.mjs tools/beispiel/ablauf.json > browser.txt
          diff -u server.txt browser.txt && echo "$(wc -l < server.txt) Zeilen, beide Seiten gleich"

  abfragebaum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # frontend/public/sna-tree.json is generated and committed. This catches an edit to
      # tools/sna_authored.py that never made it into the file the app actually loads.
      - name: Regenerate and compare
        run: |
          python tools/build_sna_tree.py
          if ! git diff --exit-code --stat frontend/public/sna-tree.json; then
            echo "::error file=frontend/public/sna-tree.json::Der Abfragebaum ist nicht aktuell. tools/build_sna_tree.py ausführen und das Ergebnis mit committen."
            exit 1
          fi

      # The same check the toolchain runs, so the two cannot drift apart.
      - name: Check the graph is sound
        run: python tools/sna_pruefen.py
