name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # The render tests skip themselves when typst is missing, so it is installed here to make
      # sure they actually run. Keep the version in step with the Dockerfile.
      - name: Install typst
        env:
          TYPST_VERSION: v0.14.2
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          typst --version

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install pipenv
          pipenv sync --system

      - name: Run tests
        working-directory: backend/src
        run: python -m unittest discover -s services -t . -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `npm run build` type-checks with vue-tsc before it bundles, so this covers both.
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # The bearing and distance the sheet prints were recovered from two printed slips, not from
      # any specification, so those two values are the only thing the formula can be checked
      # against.
      - name: Check the Polar-Koordinaten
        run: node tools/polar_pruefen.mjs

      # Browser and server each flatten the working set into paths, and they have to agree
      # exactly: a path only one side knows reads to the other as an entry that was never there.
      - name: Compare the flatteners
        run: |
          python tools/pfade_vergleichen.py backend/src/render/sample/sample.json > server.txt
          node tools/pfade_vergleichen.mjs backend/src/render/sample/sample.json > browser.txt
          diff -u server.txt browser.txt && echo "$(wc -l < server.txt) Pfade, beide Seiten gleich"

  zusammenarbeit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          pip install pipenv
          cd backend && pipenv sync --system && cd ..
          cd frontend && npm ci

      # Two clients on one workspace, driving the browser's real sync module outside a browser.
      # The merge is covered by unit tests; this covers the client half — the shadow copy and the
      # way an incoming change is folded into it, which is where the bugs were.
      - name: Two clients on one workspace
        run: node tools/sync_probe.mjs

  abfragebaum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # frontend/public/sna-tree.json is generated and committed. This catches an edit to
      # tools/sna_authored.py that never made it into the file the app actually loads.
      - name: Regenerate and compare
        run: |
          python tools/build_sna_tree.py
          if ! git diff --exit-code --stat frontend/public/sna-tree.json; then
            echo "::error file=frontend/public/sna-tree.json::Der Abfragebaum ist nicht aktuell. tools/build_sna_tree.py ausführen und das Ergebnis mit committen."
            exit 1
          fi

      - name: Check the graph is sound
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          baum = json.loads(Path("frontend/public/sna-tree.json").read_text(encoding="utf-8"))
          knoten = baum["knoten"]

          offen = {a["ziel"] for n in knoten.values() for a in n.get("antworten", ())
                   if a["ziel"] not in knoten}
          if offen:
              sys.exit(f"Kanten ohne Ziel: {sorted(offen)[:5]}")

          sys.setrecursionlimit(50000)
          farbe = dict.fromkeys(knoten, 0)
          zyklen = []

          def besuchen(kid):
              if farbe[kid] == 1:
                  zyklen.append(kid)
                  return
              if farbe[kid] == 2:
                  return
              farbe[kid] = 1
              for antwort in knoten[kid].get("antworten", ()):
                  besuchen(antwort["ziel"])
              farbe[kid] = 2

          for disziplin in baum["disziplinen"]:
              besuchen(disziplin["einstieg"])

          if zyklen:
              sys.exit(f"Zyklen im Graphen: {zyklen[:5]}")
          unerreichbar = [k for k, f in farbe.items() if f == 0]
          if unerreichbar:
              sys.exit(f"{len(unerreichbar)} Knoten sind von keiner Disziplin aus erreichbar")

          endpunkte = sum(1 for n in knoten.values() if "code" in n)
          print(f"{len(knoten)} Knoten, {endpunkte} Endpunkte, keine Zyklen, alles erreichbar")
          PY
